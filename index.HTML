<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="صفحة تسجيل الدخول">
    <title>تسجيل الدخول</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body dir="rtl">
    <section class="h-100">
        <div class="container h-100">
            <div class="row justify-content-sm-center h-100">
                <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">

                    <!-- العنوان -->
                    <div class="text-center my-5">
                        <div style="text-align: center; margin-bottom: 25px;">
                            <div style="background: linear-gradient(135deg, #0d47a1, #1565c0); color: white; padding: 16px 32px; border-radius: 14px; display: inline-block; box-shadow: 0 6px 20px rgba(13, 71, 161, 0.35); font-family: 'Segoe UI', Tahoma, sans-serif; border: 1px solid rgba(255,255,255,0.15); min-width: 280px;">
                                <div style="font-size: 20px; font-weight: bold; letter-spacing: 0.5px;">إدارة المشاريع الأكاديمية</div>
                                <div style="font-size: 13px; opacity: 0.95; margin-top: 4px; font-weight: 500;">كلية الاتصالات والمعلومات بالرياض</div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-lg">
                        <div class="card-body p-5">
                            <h1 class="fs-4 card-title fw-bold mb-4">تسجيل الدخول</h1>

                            <form action="" method="POST" class="needs-validation" novalidate autocomplete="off">

                                <div class="mb-3">
                                    <label class="mb-2 text-muted" for="email">البريد الإلكتروني</label>
                                    <input id="email" type="email" class="form-control" name="email" required autofocus>
                                    <div class="invalid-feedback">البريد الإلكتروني غير صالح</div>
                                </div>

                                <div class="mb-3">
                                    <div class="mb-2 w-100 d-flex justify-content-between">
                                        <label class="text-muted" for="password">كلمة المرور</label>
                                        <a href="forgot.html" class="text-primary text-decoration-none">نسيت كلمة المرور؟</a>
                                    </div>
                                    <input id="password" type="password" class="form-control" name="password" required>
                                    <div class="invalid-feedback">كلمة المرور مطلوبة</div>
                                </div>

                                <!-- تذكرني (مربع + كلمة جنب بعض بشكل مرتب) -->
                                <div class="mb-3">
                                    <div class="d-flex align-items-center">
                                        <input type="checkbox" name="remember" id="remember" class="form-check-input" style="margin-left: 6px;">
                                        <label for="remember" class="form-check-label">تذكرني</label>
                                    </div>
                                </div>

                                <!-- زر الدخول في المنتصف -->
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary px-4">
                                        دخول
                                    </button>
                                </div>

                            </form>
                        </div>

                        <div class="card-footer py-3 border-0">
                            <div class="text-center">
                                ليس لديك حساب؟ <a href="register.html" class="text-dark">إنشاء حساب</a>
                            </div>
                        </div>
                    </div>

                    <!-- الحقوق محذوفة -->

                </div>
            </div>
        </div>
    </section>

    <script src="js/login.js"></script>
</body>
</html>
